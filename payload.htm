<!-- INJECTED PASSWALL2 URL-TEST PATCH (MULTI-TAB FULL SUPPORT & RIGHT-ALIGNED) -->
<script type="text/javascript">
(function() {
    function injectUrlTestButton() {
        var filterContainers = document.querySelectorAll('.pw-filter');

        filterContainers.forEach(function(filterContainer) {
            if (filterContainer.querySelector('.btn-test-all-urls')) return;

            filterContainer.style.display = 'flex';
            filterContainer.style.flexWrap = 'wrap';
            filterContainer.style.alignItems = 'center';
            filterContainer.style.gap = '6px';

            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "btn cbi-button cbi-button-reset btn-test-all-urls"; 
            btn.textContent = "Test All URLs";
            btn.title = "Test All URLs";

            btn.style.setProperty('margin-left', 'auto', 'important');
            btn.style.fontWeight = 'bold';
            btn.style.cursor = 'pointer';
            btn.style.color = '#169C31';
            btn.style.borderColor = '#169C31';
            btn.style.whiteSpace = 'nowrap';

            filterContainer.appendChild(btn);

            btn.onclick = function() {
                let parentContainer = btn.closest('.cbi-tabcontainer') || 
                                      document.querySelector('#cbi-passwall2-nodes > .cbi-tabcontainer[style*="display:block"]') || 
                                      document.querySelector('#cbi-passwall2-nodes > .cbi-tabcontainer[style*="display: block"]') || 
                                      document;

                let urlTestTargets = parentContainer.querySelectorAll('td.pw-urltest a, span.ping a[onclick*="urltest_node"], [onclick*="urltest_node"]');
                
                if (urlTestTargets.length === 0) {
                    alert('No URL Test engines available in this group.');
                    return;
                }

                let totalTests = urlTestTargets.length;
                let completedTests = 0;
                let delay = 0;

                if (typeof XHR !== 'undefined') {
                    var originalXHRGet = XHR.get;
                    XHR.get = function(url, args, callback) {
                        if (url && url.indexOf('urltest_node') !== -1) {
                            var originalCallback = callback;
                            callback = function(xhr, data) {
                                if (originalCallback) originalCallback(xhr, data);
                                completedTests++;
                                if (completedTests === totalTests) {
                                    XHR.get = originalXHRGet;
                                    setTimeout(() => {
                                        let deadNodesFound = 0;
                                        let rowsToProcess = [];

                                        parentContainer.querySelectorAll('tr.cbi-section-table-row, tr.tr').forEach(row => {
                                            let testTarget = row.querySelector('td.pw-urltest, [onclick*="urltest_node"]');
                                            let cb = row.querySelector('.nodes_select, input[type="checkbox"]');
                                            
                                            if (testTarget && cb) {
                                                let rowText = row.textContent || row.innerText || "";
                                                
                                                if (rowText.includes('Shunt') || rowText.includes('Balancing') || rowText.includes('URLTest')) {
                                                    cb.checked = false;
                                                    return;
                                                }

                                                let lowerRowText = rowText.toLowerCase();
                                                if (
                                                    lowerRowText.includes('gb') || lowerRowText.includes('mb') || 
                                                    lowerRowText.includes('day') || lowerRowText.includes('expire') || 
                                                    lowerRowText.includes('remaining') || lowerRowText.includes('traffic') || 
                                                    lowerRowText.includes('date') || lowerRowText.includes('http://') || 
                                                    lowerRowText.includes('https://')
                                                ) {
                                                    cb.checked = false;
                                                    return;
                                                }

                                                let text = testTarget.textContent || testTarget.innerText;
                                                let isDead = text.includes('Timeout') || text.includes('Error');
                                                
                                                if (isDead) {
                                                    deadNodesFound++;
                                                }
                                                rowsToProcess.push({ checkbox: cb, dead: isDead });
                                            }
                                        });

                                        if (typeof update_select_state === 'function') update_select_state();
                                    }, 500);
                                }
                            };
                        }
                        return originalXHRGet.apply(this, arguments);
                    };
                }

                urlTestTargets.forEach(target => {
                    setTimeout(() => { target.click(); }, delay);
                    delay += 100;
                });
            };
        });
    }

    var checkInterval = setInterval(injectUrlTestButton, 500);
    setTimeout(function() { clearInterval(checkInterval); }, 10000);
})();
</script>
<!-- END OF INJECTED PATCH -->
