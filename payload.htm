<!-- INJECTED PASSWALL2 URL-TEST PATCH (MULTI-TAB + PERSISTENT + RESET-PROOF) -->
<script type="text/javascript">
(function() {
    'use strict';

    function injectUrlTestButton() {
        var filterContainers = document.querySelectorAll('.pw-filter');

        filterContainers.forEach(function(filterContainer) {
            // Уже есть кнопка в этом контейнере — пропускаем
            if (filterContainer.querySelector('.btn-test-all-urls')) return;

            // Делаем flex, чтобы margin-left: auto работал
            filterContainer.style.display = 'flex';
            filterContainer.style.flexWrap = 'wrap';
            filterContainer.style.alignItems = 'center';
            filterContainer.style.gap = '6px';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn cbi-button cbi-button-reset btn-test-all-urls';
            btn.textContent = 'Test All URLs';
            btn.title = 'Test All URLs in current group';

            btn.style.setProperty('margin-left', 'auto', 'important');
            btn.style.fontWeight = 'bold';
            btn.style.cursor = 'pointer';
            btn.style.color = '#169C31';
            btn.style.borderColor = '#169C31';
            btn.style.whiteSpace = 'nowrap';

            filterContainer.appendChild(btn);

            // === Обработчик тестирования ===
            btn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                var parentContainer = btn.closest('.cbi-tabcontainer') ||
                                      document.querySelector('#cbi-passwall2-nodes .cbi-tabcontainer[style*="display: block"], #cbi-passwall2-nodes .cbi-tabcontainer[style*="display:block"]') ||
                                      document.getElementById('cbi-passwall2-nodes') ||
                                      document;

                var urlTestTargets = parentContainer.querySelectorAll(
                    'td.pw-urltest a, span.ping a[onclick*="urltest_node"], [onclick*="urltest_node"]'
                );

                if (urlTestTargets.length === 0) {
                    alert('No URL Test engines available in this group.');
                    return;
                }

                var totalTests = urlTestTargets.length;
                var completedTests = 0;
                var delay = 0;

                if (typeof XHR !== 'undefined') {
                    var originalXHRGet = XHR.get;
                    XHR.get = function(url, args, callback) {
                        if (url && url.indexOf('urltest_node') !== -1) {
                            var originalCallback = callback;
                            callback = function(xhr, data) {
                                if (originalCallback) originalCallback(xhr, data);
                                completedTests++;
                                if (completedTests >= totalTests) {
                                    XHR.get = originalXHRGet;
                                    setTimeout(function() {
                                        parentContainer.querySelectorAll('tr.cbi-section-table-row, tr.tr').forEach(function(row) {
                                            var testTarget = row.querySelector('td.pw-urltest, [onclick*="urltest_node"]');
                                            var cb = row.querySelector('.nodes_select, input[type="checkbox"]');
                                            if (!testTarget || !cb) return;

                                            var rowText = (row.textContent || row.innerText || '');
                                            if (rowText.includes('Shunt') || rowText.includes('Balancing') || rowText.includes('URLTest')) {
                                                cb.checked = false;
                                                return;
                                            }

                                            var lower = rowText.toLowerCase();
                                            if (lower.includes('gb') || lower.includes('mb') || lower.includes('day') ||
                                                lower.includes('expire') || lower.includes('remaining') || lower.includes('traffic') ||
                                                lower.includes('date') || lower.includes('http://') || lower.includes('https://')) {
                                                cb.checked = false;
                                                return;
                                            }

                                            var text = testTarget.textContent || testTarget.innerText || '';
                                            var isDead = text.includes('Timeout') || text.includes('Error') || text.includes('—') || text.trim() === '';
                                            // Можно раскомментировать, если нужно автоматически выделять мёртвые:
                                            // cb.checked = isDead;
                                        });
                                        if (typeof update_select_state === 'function') update_select_state();
                                    }, 400);
                                }
                            };
                        }
                        return originalXHRGet.apply(this, arguments);
                    };
                }

                urlTestTargets.forEach(function(target) {
                    setTimeout(function() { target.click(); }, delay);
                    delay += 80;
                });
            };
        });
    }

    // -------------------------------------------------
    // 1. MutationObserver — главная защита от Reset и динамических вкладок
    // -------------------------------------------------
    var observer = new MutationObserver(function(mutations) {
        var needInject = false;
        for (var i = 0; i < mutations.length; i++) {
            if (mutations[i].addedNodes.length || mutations[i].removedNodes.length) {
                needInject = true;
                break;
            }
        }
        if (needInject) {
            // Небольшая задержка, чтобы PassWall успел дорисовать фильтр
            setTimeout(injectUrlTestButton, 50);
        }
    });

    function startObserver() {
        var target = document.getElementById('cbi-passwall2-nodes') ||
                     document.getElementById('node_list') ||
                     document.body;
        if (target) {
            observer.observe(target, {
                childList: true,
                subtree: true
            });
        }
    }

    // -------------------------------------------------
    // 2. Делегированный клик по Reset
    // -------------------------------------------------
    document.addEventListener('click', function(e) {
        var resetBtn = e.target.closest('button[data-pw-reset="1"], .pw-filter button');
        if (resetBtn && (resetBtn.getAttribute('data-pw-reset') === '1' || resetBtn.textContent.trim() === 'Reset')) {
            setTimeout(injectUrlTestButton, 100);
            setTimeout(injectUrlTestButton, 350); // второй раз на всякий случай
        }
    }, true);

    // -------------------------------------------------
    // 3. Первичный запуск + лёгкий safety-interval
    // -------------------------------------------------
    injectUrlTestButton();
    startObserver();

    // На случай очень поздней загрузки вкладок
    var safetyInterval = setInterval(injectUrlTestButton, 1500);
    // Можно не останавливать — нагрузка мизерная. Если хочется остановить через минуту:
    // setTimeout(function(){ clearInterval(safetyInterval); }, 60000);

})();
</script>
<!-- END OF INJECTED PATCH -->
